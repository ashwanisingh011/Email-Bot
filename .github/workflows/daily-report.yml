name: Automated Daily Status Report

on:
  schedule:
    # 6:30 PM IST = 1:00 PM UTC (13:00 UTC) Monday to Friday
    - cron: '0 13 * * 1-5'
  workflow_dispatch: # Allows you to manually trigger it from the GitHub Actions tab anytime

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile TypeScript to JavaScript
        run: npm run build

      - name: Execute Daily Report Bot
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TARGET_REPOS: ${{ secrets.TARGET_REPOS }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          RECIPIENTS: ${{ secrets.RECIPIENTS }}
          DEVELOPER_NAME: ${{ secrets.DEVELOPER_NAME }}
          JOB_TITLE: ${{ secrets.JOB_TITLE }}
          COMPANY_NAME: ${{ secrets.COMPANY_NAME }}
          ASSIGNED_BY: ${{ secrets.ASSIGNED_BY }}
          WORK_HOURS: ${{ secrets.WORK_HOURS }}
        run: npm run prod