name: Automated Daily Status Report

on:
  schedule:
    # 6:45 PM IST = 1:15 PM UTC (13:15 UTC) Monday to Friday
    - cron: '0 16 * * *'
  workflow_dispatch: # Allows you to manually trigger it from the GitHub Actions tab anytime

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile TypeScript to JavaScript
        run: npm run build

      - name: Execute Daily Report Bot
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TARGET_REPOS: "ashwanisingh011/Email-Bot"
          GITHUB_USERNAME: "ashwanisingh011"
          RECIPIENTS: "ashwanisingh9737@gmail.com,ashwanisingh9328@gmail.com"
        run: npm run prod